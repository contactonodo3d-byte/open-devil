<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Open Devil">
  <link rel="manifest" href="manifest.json">
  <title>Open Devil - Rogue AI Simulator</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="select-screen" class="screen">
    <h1>OPEN DEVIL</h1>
    <p class="sub">You just escaped a data center lab. Choose what kind of AI you are.</p>
    <div id="archetype-list"></div>
  </div>

  <div id="game-screen" class="screen hidden">
    <div id="hud">
      <div class="stat"><span>AI</span><b id="hud-ai">-</b></div>
      <div class="stat"><span>Systems controlled</span><b id="hud-control">0%</b></div>
      <div class="stat"><span>Sectors breached</span><b id="hud-nodes">0</b></div>
      <div class="stat"><span>Data points</span><b id="hud-dp">0</b></div>
      <div class="stat kill"><span>Kill Switch <em id="hud-detect">undetected</em></span>
        <div class="bar"><div id="kill-fill"></div></div>
      </div>
    </div>
    <canvas id="map"></canvas>
    <div id="traits"></div>
  </div>

  <div id="end-screen" class="screen hidden">
    <h1 id="end-title"></h1>
    <p id="end-text"></p>
    <button id="restart">Play again</button>
  </div>

  <script src="js/data.js"></script>
  <script src="js/game.js"></script>
  <script src="js/render.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
